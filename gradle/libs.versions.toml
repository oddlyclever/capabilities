[versions]
# `namespace` is the package/bundleId prefix; each module appends its own name.
# `group` is the Maven groupId. Both are com.oddlyclever here.
namespace = "com.oddlyclever"
group = "com.oddlyclever"
versionName = "0.0.3"

# Kept low so consuming apps are not forced up; module cores are pure Kotlin.
android-minSdk = "24"
android-compileSdk = "37"

agp = "9.4.1"
kotlin = "2.4.21"
vanniktech = "0.37.0"
# Provisioned repo-wide (the root applies the plugins `apply false`) so modules that need Compose can opt in.
compose-multiplatform = "1.12.1"

# webpack for the Kotlin/JS and Kotlin/Wasm test and bundle tooling, overriding the version Kotlin ships (see the
# root build.gradle.kts for why).
webpack = "5.111.1"

# Libraries are added with the modules that need them, each with a comment naming that module and why.

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
multiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
