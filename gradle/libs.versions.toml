[versions]
# `namespace` is the package/bundleId prefix; each module appends its own name.
# `group` is the Maven groupId. Both are com.oddlyclever here.
namespace = "com.oddlyclever"
group = "com.oddlyclever"
versionName = "0.0.3"

# Kept low so consuming apps are not forced up; module cores are pure Kotlin.
android-minSdk = "24"
android-compileSdk = "37"

agp = "9.4.1"
kotlin = "2.4.21"
vanniktech = "0.37.0"
# Provisioned repo-wide (the root applies the plugins `apply false`) so modules that need Compose can opt in.
compose-multiplatform = "1.12.1"

# webpack for the Kotlin/JS and Kotlin/Wasm test and bundle tooling, overriding the version Kotlin ships (see the
# root build.gradle.kts for why).
webpack = "5.111.1"

# map-view, the tiled map :kartog builds on. Its family is released in lockstep, so one version covers every
# artifact of it. It is 0.x and its types are part of kartog's public API, so a bump is a deliberate change.
mapView = "0.2.0"
kotlinxCoroutines = "1.11.0"
# :media-image's web target: the DOM, for <img> and <canvas>.
kotlinxBrowser = "0.5.0"
# Skia's native libraries, which :kartog-headless bundles so a server needs no Compose desktop setup. Must be the
# Skiko version Compose Multiplatform brings (Compose 1.12.1 brings 0.150.1); move it with every Compose bump.
skiko = "0.150.1"
# H3 hexagonal grid, used by :h3spatial. These move together with the vendored C source pinned in
# h3spatial/native/PROVENANCE: a version that advances on some targets and not others gives different answers per
# platform for the same input. uberH3 backs the JVM and Android targets, h3Js the JS and wasmJs targets (an npm
# dependency, so it is read as a string rather than a library).
uberH3 = "4.5.0"
h3Js = "4.5.0"
# :media-webp's, :media-image's and :h3spatial's Android device tests, which run the common tests against their native
# libraries on an emulator or device.
androidx-test-ext = "1.3.0"
androidx-test-runner = "1.7.0"
# :platform: ComponentActivity for ActivityProvider, and App Startup for the initializer.
androidx-activity = "1.13.0"
androidx-startup = "1.2.0"
androidx-test-core = "1.7.0"

[libraries]
# Libraries are added with the modules that need them, each with a comment naming that module and why.

# :kartog exposes these as api: MapCameraState, TileKey and MapState are kartog's own vocabulary.
mapview-base = { module = "com.coderwise.libs:map-view", version.ref = "mapView" }
mapview-tiles-core = { module = "com.coderwise.libs:map-view-tiles", version.ref = "mapView" }
# :kartog exposes these as api: its map draws the compass, scale bar, zoom buttons and attribution from them.
mapview-controls = { module = "com.coderwise.libs:map-view-controls", version.ref = "mapView" }
# :kartog-vector exposes the vector tiles it styles and rasterizes, and the raster slot that draws a rasterized tile.
mapview-tiles-vector = { module = "com.coderwise.libs:map-view-tiles-vector", version.ref = "mapView" }
# :kartog-raster exposes the raster slot its fading slot wraps; :kartog-vector, as above.
mapview-tiles-raster = { module = "com.coderwise.libs:map-view-tiles-raster", version.ref = "mapView" }
# :kartog-geojson exposes map-view's GeoJSON model, style and overlay.
mapview-geojson = { module = "com.coderwise.libs:map-view-geojson", version.ref = "mapView" }

# :kartog's map state, and :kartog-raster and :kartog-vector, which decode and rasterize tiles on Dispatchers.Default.
# The version map-view 0.2.0 is built with.
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
# runTest, for the suspending functions the kartog modules test.
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# :media-webp's and :h3spatial's Android device tests: their native code loads only on a device.
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }

# :platform exposes these: ActivityProvider's ComponentActivity, and PlatformInitializer's App Startup supertype.
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidx-activity" }
androidx-startup-runtime = { module = "androidx.startup:startup-runtime", version.ref = "androidx-startup" }
# :platform's device test launches an activity with ActivityScenario.
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }

# :media-image decodes and resizes on the web with <img> and <canvas>.
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinxBrowser" }

# H3 for :h3spatial: com.uber:h3 on the JVM, and Uber's own Android packaging of the same binding (ARM and ARM64) on
# Android. iOS compiles the vendored C and the web uses h3-js.
uber-h3 = { module = "com.uber:h3", version.ref = "uberH3" }
uber-h3-android = { module = "com.uber:h3-android", version.ref = "uberH3" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

# :media-webp encodes through Skia on the JVM and the web, whose WebP encoder is libwebp. The classes only; an app brings
# the native library for its platform, as Compose does.
skiko = { module = "org.jetbrains.skiko:skiko", version.ref = "skiko" }
# :media-webp's and :media-image's web tests: Skia's WebAssembly, which a Compose app's build would otherwise unpack.
skiko-wasm-runtime = { module = "org.jetbrains.skiko:skiko-js-wasm-runtime", version.ref = "skiko" }

# :kartog-headless, at runtime only: Skia for the server platforms, and macOS for running it on a developer's machine.
# :media-webp's and :media-image's JVM tests, for the machine they run on.
skiko-runtime-linux-x64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-linux-x64", version.ref = "skiko" }
skiko-runtime-linux-arm64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-linux-arm64", version.ref = "skiko" }
skiko-runtime-macos-arm64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-macos-arm64", version.ref = "skiko" }
skiko-runtime-macos-x64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-macos-x64", version.ref = "skiko" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
multiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
