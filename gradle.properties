#Kotlin
kotlin.code.style=official
# Linking the JS and Wasm test bundles of the wayfinder modules runs out of memory in 3 GB; 6 GB passes a clean
# check with no build cache.
kotlin.daemon.jvmargs=-Xmx6g
#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
#AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Shared iOS code (iosMain) sees a module's cinterop bindings, as :media-webp's libwebp; without it only each target does.
kotlin.mpp.enableCInteropCommonization=true
