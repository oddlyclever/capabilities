# .github/workflows/test.yml

name: Test

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

env:
  # GitHub's hosted Mac has about 7 GB of memory and 3 cores. The Kotlin daemon keeps the 6 GB gradle.properties gives
  # it, which linking the wayfinder modules' JS and Wasm test bundles needs, so the Gradle daemon gets less here than on
  # a workstation, and two workers keep two Kotlin/Native links or browser test runs from landing at once.
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC" -Dorg.gradle.workers.max=2

jobs:
  test:
    name: Run Multiplatform Tests
    # macOS, because the iOS targets only compile on a Mac. GitHub's hosted runners are free for a public repository.
    runs-on: macos-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run all tests
        run: ./gradlew check

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/build/test-results/**/*.xml'
