# .github/workflows/test.yml

name: Test

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC"

jobs:
  test:
    name: Run Multiplatform Tests
    # macOS, because the iOS targets only compile on a Mac. The org's own Mac rather than a GitHub-hosted one, which
    # bills at ten times the Linux rate and used up the month's included minutes.
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      checks: write
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run all tests
        run: ./gradlew check

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/build/test-results/**/*.xml'
